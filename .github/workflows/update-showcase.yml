name: Update Showcase Data

on:
  schedule:
    - cron: "0 6 * * *"  # daily at 06:00 UTC
  workflow_dispatch: {}   # allows manual "Run workflow" trigger

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate data.json
        env:
          SCAN_TOKEN: ${{ secrets.SCAN_TOKEN }}
        run: python generate_data.py

      - name: Commit if changed
        run: |
          git config --global user.name "Author's-Automated"
          git config --global user.email "150334794+shehryar-92@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "chore: update showcase data"
          git push
